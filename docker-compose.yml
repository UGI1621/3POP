services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  engine:
    build:
      context: .
      target: dev
    init: true
    command: /app/node_modules/.bin/tsc -p packages/engine/tsconfig.build.json --watch --preserveWatchOutput
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "test", "-f", "/app/packages/engine/dist/index.js"]
      interval: 2s
      timeout: 2s
      retries: 30

  server:
    build:
      context: .
      target: dev
    init: true
    # pnpm을 거치면 SIGTERM을 받은 pnpm이 먼저 죽어서 graceful shutdown이 안 됨 → node 직접 실행
    command: sh -c "cd apps/server && exec node --watch src/index.ts"

    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:${SERVER_PORT}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/server/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy

  client:
    build:
      context: .
      target: dev
    init: true
    command: sh -c "cd apps/client && exec ./node_modules/.bin/vite --host 0.0.0.0"
    ports:
      - "127.0.0.1:${CLIENT_PORT}:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/client/node_modules
    depends_on:
      engine:
        condition: service_healthy
volumes:
  postgres-data:
  redis-data:
